  const rows=T.subs.filter(s=>s.round_key===st.key).map(s=>({gid:s.gid,name:s.name,
    ms:st.serverStart?isoMs(s.created_at)-start:(s.client_ms||0),
    correct:check(s.faces||[],st.sid,st.type).every(Boolean)}));
  if(T.useBots){const el=Date.now()-T.localStart-3000;T.bots.forEach(b=>{if(st.status!=='play'||el>=b.ms) rows.push({gid:b.name,name:b.name,ms:b.ms,correct:b.correct,bot:true})})}
  return rows.sort((a,b)=>a.ms-b.ms);
}
function liveList(rows,reveal,winner){
  if(!rows.length) return `<li><span class="rk">–</span><span class="nm muted">รอกลุ่มแรกส่ง…</span><span></span><span></span></li>`;
  return rows.map((x,i)=>`<li class="${reveal&&x.name===winner?'win':''}"><span class="rk">${i+1}</span><span class="nm">${esc(x.name)}</span><span class="sec">${fmt(x.ms)}s</span>${reveal?`<span class="mark ${x.correct?'ok':'bad'}">${x.correct?'✓':'✗'}</span>`:'<span class="mark wait">ส่งแล้ว</span>'}</li>`).join('');
}
function updateTeacherLive(){
  const st=T.state;if(!st) return;
  if(st.status==='play'){const el=$('#live');if(el)el.innerHTML=liveList(currentRows(),false)}
}
function teacherTick(){
  const st=T.state;if(!st||st.status!=='play') return;
  countOverlay();
  const el=$('#timer');if(el) el.textContent=fmt(Date.now()-T.localStart-3000)+'s';
  if(T.useBots){const n=T.bots.filter(b=>Date.now()-T.localStart-3000>=b.ms).length;if(n!==T._botN){T._botN=n;updateTeacherLive()}}
}
async function tWrite(next){
  const {data,error}=await sb.rpc('ehsr_set_state',{p_code:T.room,p_token:T.token,p_state:next});
  if(error){toast('บันทึกไม่สำเร็จ: '+error.message);return false}
  T.state={...blankState(),...data};render();return true;
}
async function tStart(pick){
  const st={...(T.state||blankState())};
  if(st.round>=st.total) return;
  let sid,type;
  if(pick){[sid,type]=pick.split(':');type=+type}
  else{
    const left=S.map(s=>s.id).filter(id=>!st.used.includes(id));
    sid=shuffle(left)[0];
    const types=(st.history||[]).map(h=>h.type);
    type=(st.round===st.total-1&&types.length&&types.every(t=>t===types[0]))?(types[0]===1?2:1):(Math.random()<.5?1:2);
  }
  T._botN=0;
  const base=Math.max(14000,34000-st.round*5000);
  T.bots=BOTS.map(n=>({name:n,ms:base+Math.random()*26000,correct:Math.random()<.78}));
  T.localStart=Date.now();
  const ok=await tWrite({...st,status:'play',round:st.round+1,sid,type,used:[...st.used,sid],key:'k'+Date.now().toString(36),startAt:Date.now(),results:[],winner:'',mode:$('#pm')?$('#pm').value:st.mode});
  if(ok) T.localStart=Date.now();
}
async function tReveal(){
  // pick up any last-second submissions before ranking
  const {data}=await sb.from('ehsr_subs').select('*').eq('room',T.room).eq('round_key',T.state.key);
  (data||[]).forEach(r=>{if(!T.subs.find(x=>x.id===r.id))T.subs.push(r)});
  const st={...T.state};const rows=currentRows();
  const win=rows.find(r=>r.correct);
  const scores={...(st.scores||{})};
  if(win){scores[win.name]=(scores[win.name]||0)+1}
  const totals=addTotals(JSON.parse(JSON.stringify(st.totals||{})),rows,win?win.name:null);
  fanfare();
  await tWrite({...st,status:'reveal',results:rows.map(r=>({gid:r.gid,name:r.name,ms:Math.round(r.ms),correct:r.correct})),winner:win?win.name:'',scores,totals,history:[...(st.history||[]),{round:st.round,sid:st.sid,type:st.type,winner:win?win.name:''}]});
}
async function tEnd(){await tWrite({...T.state,status:'end'})}
async function tReset(){
  if(!T.confirmReset){T.confirmReset=true;render();return}
  T.confirmReset=false;
  const {error}=await sb.rpc('ehsr_reset',{p_code:T.room,p_token:T.token});
  if(error){toast('ล้างข้อมูลไม่สำเร็จ: '+error.message);return}
  T.subs=[];T.groups=[];T.bots=[];
  await tWrite({...blankState(),mode:$('#pm')?$('#pm').value:'plain'});
  toast('เริ่มเกมใหม่แล้ว (ห้องเดิม '+T.room+')');
}
function drawQR(){
  const el=$('#qr');if(!el||!window.QRCode||el.dataset.done===T.room) return;
  el.innerHTML='';el.dataset.done=T.room;
  new QRCode(el,{text:joinURL(T.room),width:168,height:168,correctLevel:QRCode.CorrectLevel.M});
}
function teacherHTML(){
  const head=`<div class="topbar">${brand()}<div class="row">${T.room?`<span class="pill" style="color:var(--accent)">ห้อง ${T.room}</span>`:''}<button class="btn ghost" data-go="home">← หน้าแรก</button></div></div>`;
  if(!sb) return head+offline();
  if(!T.room||!T.state){tInit();return head+`<p class="muted">กำลังเตรียมห้องเกม…</p>`}
  const st=T.state;
  if(!tick) tick=setInterval(teacherTick,100);
  setTimeout(drawQR,0);
  const roomPanel=`<div class="panel roompanel"><div class="stack" style="gap:6px;min-width:0"><span class="eyebrow">รหัสห้อง · ให้แต่ละกลุ่มสแกน QR หรือพิมพ์รหัส</span><div class="roomcode">${T.room}</div><p class="muted joinurl">${esc(joinURL(T.room))}</p></div><div id="qr" class="qr" aria-label="QR code สำหรับเข้าห้อง"></div></div>`;
  const controls=`<div class="panel stack"><div class="row" style="justify-content:space-between"><h3>แผงครู</h3><span class="muted">รอบ ${st.round} / ${st.total}</span></div>
    <div class="row"><label for="pm">โจทย์บนจอ</label><select id="pm">${modeOpts(st.mode)}</select></div>
    <label class="tg"><input type="checkbox" id="botsT" ${T.useBots?'checked':''}> เพิ่มทีมจำลอง 3 ทีม (ไว้ทดสอบ · ปิดเมื่อสอนจริง)</label>
    ${st.status==='idle'||st.status==='reveal'?(st.round<st.total?`<div class="row"><button class="btn primary big" data-act="t-start">🎲 สุ่มประโยค · เริ่มรอบ ${st.round+1}</button></div>
      <div class="row"><select id="pick"><option value="">หรือเลือกประโยคเอง…</option>${S.filter(s=>!st.used.includes(s.id)).flatMap(s=>[1,2].map(t=>`<option value="${s.id}:${t}">T${t} · ${esc(sentenceText(s.id,t))}</option>`)).join('')}</select><button class="btn" data-act="t-pick">เริ่มด้วยประโยคนี้</button></div>`
      :`<button class="btn primary big" data-act="t-end">🏆 ดูสรุปผล 3 รอบ</button>`):''}
    ${st.status==='play'?`<button class="btn primary big" data-act="t-reveal">⏹ หยุดเวลา · เฉลย</button>`:''}
    <div class="row"><button class="btn ghost" data-act="t-reset">${T.confirmReset?'กดอีกครั้งเพื่อยืนยัน: ล้างคะแนนทั้งหมด':'↺ เริ่มเกมใหม่ (ห้องเดิม)'}</button>${T.confirmReset?'<button class="btn ghost" data-act="t-cancel">ยกเลิก</button>':''}<button class="btn ghost" data-act="t-newroom">＋ สร้างห้องใหม่ (คาบใหม่)</button></div>
    <div><h3 style="margin-bottom:6px">กลุ่มที่เข้าร่วม (${T.groups.length})</h3><div class="teams" id="teams">${teamsHTML()}</div></div></div>`;
  if(st.status==='end'){
    return head+finalHTML(totalsList(st.totals),st.history||[])+`<div style="margin-top:16px">${controls}</div>`;
  }
  if(st.status==='idle'){
    return head+`<div class="grid2"><div class="stack">${roomPanel}<div class="board"><span class="eyebrow">พร้อมเริ่ม</span><h2>Eco Hero Sentence Race</h2><p class="muted">เมื่อทุกกลุ่มเข้าห้องครบ ครูกดสุ่มประโยคเพื่อเริ่มรอบที่ 1</p></div></div>${controls}</div>`;
  }
  const reveal=st.status==='reveal';
  const rows=reveal?st.results:currentRows();
  return head+`<div class="board"><div class="meta"><span class="eyebrow">รอบที่ ${st.round} / ${st.total} · ห้อง ${T.room}</span>${reveal||st.mode==='thai'?typePill(st.type):''}<span class="timer" id="timer">${reveal?'⏹':'0.0s'}</span></div>${promptHTML(st.sid,st.type,st.mode)}${reveal?answerStrip(st.sid,st.type):''}</div>
  <div class="grid2"><div class="panel stack"><h2>${reveal?(st.winner?`🏆 รางวัลรอบนี้: ${esc(st.winner)}`:'ไม่มีกลุ่มที่ถูกต้องในรอบนี้'):'ลำดับการส่ง'}</h2><ul class="lb" id="live">${liveList(rows,reveal,st.winner)}</ul>${scoreBar(st.scores)}</div>${controls}</div>`;
}

/* ----- group ----- */
let grp=null;
function gApply(st){
  const raw=JSON.stringify(st); if(grp.raw===raw) return; grp.raw=raw;
  const prev=grp.state;grp.state=st;
  if(st.status==='play'&&st.key!==grp.key){
    grp.key=st.key;grp.pad=newPad(st.key);grp.pad.locked=true;grp.countTo=Date.now()+3000;grp.submitted=null;
    clearInterval(tick);tick=setInterval(groupTick,100);
  }
  if(st.status==='idle'&&prev&&prev.status!=='idle'){grp.key='';grp.pad=null;grp.submitted=null}
  if(st.status==='reveal'&&prev&&prev.status!=='reveal'){const me=(st.results||[]).find(r=>r.gid===grp.gid);if(st.winner&&st.winner===grp.name)fanfare();else if(me)beep(300,.2,'triangle',.1)}
  if(app.view==='group') render();
}
async function gPoll(){
  if(!grp) return;
  const {data}=await sb.from('ehsr_rooms').select('state').eq('code',grp.room).maybeSingle();
  if(data) gApply({...blankState(),...data.state});
}
function gListen(){
  if(grp.chan) sb.removeChannel(grp.chan);
  grp.chan=sb.channel('g-'+grp.room+'-'+grp.gid)
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'ehsr_rooms',filter:'code=eq.'+grp.room},p=>gApply({...blankState(),...p.new.state}))
    .subscribe();
  clearInterval(grp.poll);grp.poll=setInterval(gPoll,3000); // safety net
}
function groupTick(){
  if(!grp||!grp.pad) return;
  if(grp.countTo){
    if(Date.now()>=grp.countTo){grp.countTo=0;grp.padStart=performance.now();grp.pad.locked=!!grp.submitted;beep(980,.25,'square',.12);render()}
    else countOverlay();
    return;
  }
  const el=$('#timer');if(el&&!grp.submitted&&grp.state.status==='play') el.textContent=fmt(performance.now()-grp.padStart)+'s';
}
async function gJoin(n){
  const inp=$('#roomIn'); const code=(inp?inp.value:'').trim();
  if(!/^\d{4}$/.test(code)){toast('ใส่รหัสห้อง 4 หลักก่อน');if(inp)inp.focus();return}
  const {data,error}=await sb.from('ehsr_rooms').select('state').eq('code',code).maybeSingle();
  if(error||!data){toast('ไม่พบห้อง '+code+' · ตรวจรหัสบนจอครูอีกครั้ง');return}
  const name='ทีม '+TEAMS[n-1];
  const ins=await sb.from('ehsr_groups').upsert({room:code,gid:'g'+n,name},{onConflict:'room,gid',ignoreDuplicates:true});
  if(ins.error){toast('เข้าร่วมไม่สำเร็จ: '+ins.error.message);return}
  lsSet('ehsr-team',n);lsSet('ehsr-room',code);
  if(grp){clearInterval(grp.poll);if(grp.chan)sb.removeChannel(grp.chan)}
  grp={room:code,gid:'g'+n,n,name,state:null,key:'',pad:null,raw:''};
  gApply({...blankState(),...data.state});
  gListen();render();
}
async function gSubmit(){
  const st=grp.state, pad=grp.pad;
  const faces=padFaces(pad);
  const clientMs=Math.round(performance.now()-grp.padStart);
  pad.locked=true;pad.sel=null;grp.submitted={clientMs};
  beep(760,.15,'triangle',.14);render();
  const {error}=await sb.from('ehsr_subs').insert({room:grp.room,round_key:st.key,gid:grp.gid,name:grp.name,faces,client_ms:clientMs});
  if(error&&error.code!=='23505'){
    if(error.code==='42501'){toast('ครูปิดรอบนี้แล้ว ส่งไม่ทัน');return}
    grp.submitted=null;pad.locked=false;toast('ส่งไม่สำเร็จ ลองกดอีกครั้ง');render();
  }
}
function groupHTML(){
  const head=`<div class="topbar">${brand()}<div class="row">${grp?`<span class="pill" style="color:var(--accent)">${esc(grp.name)} · ห้อง ${grp.room}</span>`:''}<button class="btn ghost" data-go="home">← หน้าแรก</button></div></div>`;
  if(!sb) return head+offline();
  if(!grp){
    const code=params.get('room')||lsGet('ehsr-room','');const last=lsGet('ehsr-team',0);
    return head+`<section class="panel stack"><span class="eyebrow">กลุ่มนักเรียน</span><h2>1) ใส่รหัสห้องจากจอครู &nbsp;2) แตะชื่อทีม</h2>
      <div class="row"><label for="roomIn" style="font-family:var(--display);font-size:18px">รหัสห้อง</label><input type="text" id="roomIn" inputmode="numeric" autocomplete="off" maxlength="4" value="${esc(code)}" class="roomin"></div>
      <div class="teamgrid">${TEAMS.map((t,i)=>`<button class="btn ${last===i+1?'primary':''}" data-join="${i+1}">ทีม ${t}</button>`).join('')}</div></section>`;
  }
  const st=grp.state;
  if(!st) return head+`<p class="muted">กำลังเชื่อมต่อ…</p>`;
  if(st.status==='end'){return head+finalHTML(totalsList(st.totals),st.history||[])}
  if(!grp.pad||st.status==='idle') return head+`<section class="board" style="text-align:center"><span class="eyebrow">${esc(grp.name)} · ห้อง ${grp.room}</span><h1>เข้าห้องแล้ว · รอครูเริ่มรอบ…</h1><p class="muted">ดูโจทย์บนจอหน้าห้อง เมื่อครูกดเริ่ม บัตรคำ 30 ใบจะปรากฏที่นี่</p></section>`;
  if(st.status==='reveal'&&st.key===grp.key){
    const res=st.results||[];const i=res.findIndex(r=>r.gid===grp.gid);const me=res[i];
    grp.pad.marks=grp.submitted?check(padFaces(grp.pad),st.sid,st.type):null;grp.pad.locked=true;
    return head+`<div class="board"><div class="meta"><span class="eyebrow">รอบที่ ${st.round} · เฉลย</span>${typePill(st.type)}</div>
      <h2>${st.winner===grp.name?'🏆 กลุ่มเราได้รางวัลรอบนี้!':me?`ลำดับที่ ${i+1} · ${fmt(me.ms)} วินาที · ${me.correct?'ถูกต้อง ✓':'ยังไม่ถูก ✗'}`:'กลุ่มเราไม่ได้ส่งในรอบนี้'}</h2>${answerStrip(st.sid,st.type)}</div>
      <div class="grid2"><div class="stack">${matHTML(grp.pad)}${tipFor(grp.pad.marks,st.type)}</div><div class="panel stack"><h3>ลำดับรอบนี้</h3><ul class="lb">${res.map((x,k)=>`<li class="${x.name===st.winner?'win':''} ${x.gid===grp.gid?'me':''}"><span class="rk">${k+1}</span><span class="nm">${esc(x.name)}</span><span class="sec">${fmt(x.ms)}s</span><span class="mark ${x.correct?'ok':'bad'}">${x.correct?'✓':'✗'}</span></li>`).join('')}</ul></div></div>`;
  }
  const sent=!!grp.submitted;
  return head+`<div class="game">
    <section class="col trayside" id="trayzone" aria-label="บัตรคำ">${sent?`<div class="sentmsg"><h2 style="color:var(--ok)">ส่งแล้ว! รอครูเฉลย…</h2><p class="muted">ดูลำดับการส่งบนจอหน้าห้อง</p></div>`:trayHTML(grp.pad)}</section>
    <section class="col matcol" id="rightzone"><div class="board compact"><div class="meta"><span class="eyebrow">รอบที่ ${st.round} / ${st.total} · ดูประโยคบนจอหน้าห้อง</span><span class="timer" id="timer">${sent?fmt(grp.submitted.clientMs)+'s':'0.0s'}</span></div></div>
    ${matHTML(grp.pad)}
    <div class="row"><button class="btn primary big" data-act="g-submit" ${!sent&&!grp.pad.locked&&grp.pad.slots.every(Boolean)?'':'disabled'}>ส่งคำตอบ ✓</button>${listenBtn(grp.pad)}${sent?'':'<button class="btn ghost" data-act="g-clear">เคลียร์ Mat</button>'}</div>
    </section></div>`;
}

/* ================= EVENTS ================= */
document.addEventListener('click',e=>{
  const sy=e.target.closest('[data-say]');if(sy){speak(sy.dataset.say,0.85);return}
  const g=e.target.closest('[data-go]');
  if(g){const v=g.dataset.go;if(v==='solo'){soloStart();return}go(v);return}
  const j=e.target.closest('[data-join]');if(j){gJoin(+j.dataset.join);return}
  if(app.view==='solo'&&solo&&solo.pad&&solo.status==='play'){if(padClick(e,solo.pad,()=>{render()}))return}
  if(app.view==='group'&&grp&&grp.pad){if(padClick(e,grp.pad,()=>render()))return}
  const a=e.target.closest('[data-act]');if(!a) return;
  const act=a.dataset.act;
  if(act==='voice-toggle'){voiceOn=!voiceOn;lsSet('ehsr-voice',voiceOn);if(!voiceOn){try{speechSynthesis.cancel()}catch(_){}}render();return}
  if(act==='read-mat'){const p=(app.view==='solo'&&solo)?solo.pad:(grp&&grp.pad);if(p)readMat(p);return}
  if(act==='solo-start') soloStart();
  if(act==='solo-go'){solo.mode=$('#pm').value;lsSet('ehsr-mode',solo.mode);soloRound()}
  if(act==='solo-submit') soloSubmit(false);
  if(act==='solo-giveup') soloSubmit(true);
  if(act==='solo-clear'){solo.pad.slots=[null,null,null,null,null,null];solo.pad.sel=null;render()}
  if(act==='solo-next'){if(solo.round>=2){solo.status='end';render()}else{solo.round++;soloRound()}}
  if(act==='solo-new') soloStart();
  if(act==='t-start') tStart();
  if(act==='t-pick'){const v=$('#pick').value;if(!v){toast('เลือกประโยคก่อน');return}tStart(v)}
  if(act==='t-reveal') tReveal();
  if(act==='t-end') tEnd();
  if(act==='t-reset') tReset();
  if(act==='t-newroom') tNewRoom(false).catch(err=>toast('สร้างห้องไม่สำเร็จ: '+(err.message||err)));
  if(act==='t-cancel'){T.confirmReset=false;render()}
  if(act==='g-submit') gSubmit();
  if(act==='g-clear'){grp.pad.slots=[null,null,null,null,null,null];grp.pad.sel=null;render()}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-card]')){e.preventDefault();const p=activePad();if(p&&!p.locked)flipCard(p,e.target.dataset.card)}});
document.addEventListener('change',e=>{
  if(e.target.id==='botsT'){T.useBots=e.target.checked;lsSet('ehsr-bots',T.useBots);updateTeacherLive()}
  if(e.target.id==='pm'){lsSet('ehsr-mode',e.target.value);if(app.view==='teacher'&&T.state&&T.state.status!=='play'){tWrite({...T.state,mode:e.target.value})}else if(app.view==='teacher'&&T.state){tWrite({...T.state,mode:e.target.value})}}
});
render();
</script>
